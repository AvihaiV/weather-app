name: Demo (temporary public URL)

# Manually started: deploys the latest signed main images to kind in a runner, with monitoring,
# and exposes the app + read-only Grafana through Cloudflare quick tunnels for N minutes.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to keep the demo up (1-120)
        type: number
        default: 30

permissions:
  contents: read
  packages: read
  actions: read   # to find the latest fully green CI run

concurrency:
  group: demo
  cancel-in-progress: true   # a new demo replaces the running one

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 150   # hard stop even if something hangs
    steps:
      - name: Validate input
        env: { MINUTES: "${{ inputs.minutes }}" }
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 120 )); then
            echo "minutes must be 1-120"; exit 1
          fi
      # Promotion, not "latest": deploy only a commit whose WHOLE CI run passed (tests, scans, build,
      # signing, deploy + smoke tests). Code (Terraform/chart/scripts) and images come from that one commit.
      - name: Pick the latest fully green commit on main
        id: green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(gh run list --repo "$REPO" --workflow ci.yml --branch main --event push --status success \
                --limit 1 --json headSha --jq '.[0].headSha')
          [ -n "$sha" ] || { echo "no green CI run on main"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying verified commit $sha (latest green CI on main)"
          echo "::notice title=Deployed commit::$sha (latest fully green CI run on main)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.green.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/verified-images
        id: img
        with:
          tag: sha-${{ steps.green.outputs.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/kind-deploy
        with:
          backend-image: ${{ steps.img.outputs.backend }}
          frontend-image: ${{ steps.img.outputs.frontend }}
          monitoring: "true"
          grafana-anonymous: "true"
      - name: Smoke tests
        run: scripts/smoke-test.sh
      - name: Install cloudflared (pinned version + checksum)
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.11.2/cloudflared-linux-amd64
          echo "56f13335143ec0e22772963290683a84a04114a35ec64cbc794a4d39ff9bb8cf  cloudflared" | sha256sum -c -
          chmod +x cloudflared
      - name: Open tunnels and publish links
        run: |
          export KUBECONFIG=$HOME/.kube/kind-weather
          kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80 >/dev/null 2>&1 &
          # Quick tunnels: no Cloudflare account or token needed, so no secret to store.
          # They are best-effort (Cloudflare can rate-limit them): retry, show the error, fail instead of a dead link.
          tunnel() {  # $1 = local port, $2 = log name
            for attempt in 1 2 3; do
              ./cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:$1" > "$2.log" 2>&1 &
              pid=$!
              for _ in $(seq 1 45); do
                u=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$2.log" | head -1)
                [ -n "$u" ] && { echo "$u"; return 0; }
                kill -0 "$pid" 2>/dev/null || break
                sleep 2
              done
              kill "$pid" 2>/dev/null || true
              echo "::warning::$2 attempt $attempt failed:" >&2; tail -5 "$2.log" >&2
              sleep $(( attempt * 10 ))
            done
            return 1
          }
          APP=$(tunnel 8088 app-tunnel) || { echo "::error::app tunnel failed"; exit 1; }
          GRAFANA=$(tunnel 3000 grafana-tunnel) || { echo "::error::Grafana tunnel failed"; exit 1; }
          {
            echo "## Live demo (up for ${{ inputs.minutes }} minutes)"
            echo "| | URL |"
            echo "|---|---|"
            echo "| Weather app | $APP |"
            echo "| Grafana (read-only, folder **Weather**) | $GRAFANA |"
            echo
            echo "Images: signed by this repo's CI on main and verified before deploy."
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotations show at the top of the run page immediately (the summary only appears when the job ends).
          # The label is in the message too: GitHub's annotation list doesn't always show the title.
          echo "::notice title=Weather app (live demo)::Weather app: $APP"
          echo "::notice title=Grafana (live demo)::Grafana dashboards (read-only, no login, folder Weather): $GRAFANA"
      - name: Keep the demo up
        env: { MINUTES: "${{ inputs.minutes }}" }
        run: sleep $(( MINUTES * 60 ))
      # The runner VM, the kind cluster and the tunnels all disappear when the job ends (success, failure, cancel or timeout).
