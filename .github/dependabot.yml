# Weekly update PRs; each one runs the full CI (tests, scans, deploy) before it can be merged.
version: 2
updates:
  - { package-ecosystem: pip, directory: /app/backend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /app/backend, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /app/frontend, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: terraform, directory: /infra/terraform, schedule: { interval: weekly } }
  - { package-ecosystem: terraform, directory: /infra/local, schedule: { interval: weekly } }
