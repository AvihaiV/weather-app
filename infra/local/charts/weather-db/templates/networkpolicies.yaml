# Only the app namespace, the DB instances themselves (replication) and the operator may reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
spec:
  podSelector: { matchLabels: { cnpg.io/cluster: weather-db } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.appNamespace }} } }
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [backend, collector, migrate] }
      ports: [{ port: 5432 }]
    - from:
        - podSelector: { matchLabels: { cnpg.io/cluster: weather-db } }
      ports: [{ port: 5432 }, { port: 8000 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cnpg-system } }
      ports: [{ port: 5432 }, { port: 8000 }]
    - from:   # Prometheus may scrape the Postgres exporter, nothing else
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ port: 9187 }]
