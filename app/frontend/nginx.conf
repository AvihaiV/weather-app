# Single public entry point. The backend has no public route; nginx proxies only /api/*.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # Strict CSP: only our own scripts/styles; blocks injected scripts and framing.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Revalidate on every load (cheap ETag check): users never run a stale app.js after a deploy.
    add_header Cache-Control "no-cache" always;

    location /api/ {
        proxy_pass http://weather-backend:8000;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        limit_except GET { deny all; }  # read-only API
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri /index.html;
    }
}
