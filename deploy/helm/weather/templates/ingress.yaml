{{- if .Values.ingress.enabled }}
# AWS only: the Load Balancer Controller turns this into an internet-facing ALB with TLS and WAF.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather
  labels: {{- include "weather.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: {{ required "ingress.certificateArn is required" .Values.ingress.certificateArn | quote }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ required "ingress.wafAclArn is required" .Values.ingress.wafAclArn | quote }}
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - host: {{ required "ingress.host is required" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: weather-frontend, port: { name: http } }
{{- end }}
