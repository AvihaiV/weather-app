{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: weather-backend
  labels: {{- include "weather.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/component: backend }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
# Alerts on symptoms users would notice: stale data, errors, the API being down.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: weather
  labels: {{- include "weather.labels" . | nindent 4 }}
spec:
  groups:
    - name: weather
      rules:
        - alert: WeatherDataStale
          expr: time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="weather-collector"} > 3600
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "No successful weather collection for over 1 hour"
            runbook: "kubectl -n {{ .Release.Namespace }} logs job/<latest weather-collector job>; check Open-Meteo reachability and DB health"
        - alert: WeatherCollectorFailing
          expr: increase(kube_job_status_failed{namespace="{{ .Release.Namespace }}", job_name=~"weather-collector-.*"}[1h]) > 2
          labels: { severity: warning }
          annotations:
            summary: "Collector jobs are failing repeatedly"
        - alert: WeatherApiErrors
          expr: |
            sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}", status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_requests_total{namespace="{{ .Release.Namespace }}"}[5m])), 1e-9) > 0.05
          for: 10m
          labels: { severity: critical }
          annotations:
            summary: "More than 5% of API requests are failing"
        - alert: WeatherApiDown
          expr: sum(up{namespace="{{ .Release.Namespace }}", service="weather-backend"}) == 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "No backend pod is being scraped (API down)"
{{- end }}
